<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your password has been changed</title>
</head>
<body style="margin:0;padding:0;background-color:#f0effa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f0effa;padding:40px 16px;">
    <tr>
      <td align="center">
        <table width="100%" style="max-width:520px;background-color:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 4px 24px rgba(99,95,199,0.10);">

          <!-- Header -->
          <tr>
            <td style="background-color:#635FC7;padding:32px 40px;text-align:center;">
              <p style="margin:0;color:#ffffff;font-size:22px;font-weight:700;letter-spacing:-0.5px;">Kanban</p>
              <p style="margin:8px 0 0;color:rgba(255,255,255,0.75);font-size:13px;letter-spacing:2px;text-transform:uppercase;">Task Manager</p>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:40px 40px 32px;">
              <h1 style="margin:0 0 12px;font-size:20px;font-weight:700;color:#20212C;letter-spacing:-0.3px;">Password changed</h1>
              <p style="margin:0 0 28px;font-size:15px;color:#828FA3;line-height:1.6;">
                The password for <strong style="color:#20212C;">{{ .Email }}</strong> was recently changed.
                If this was you, no action is needed.
              </p>
              <p style="margin:0;font-size:15px;color:#828FA3;line-height:1.6;">
                If you didn't make this change, please reset your password immediately to secure your account.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color:#f0effa;padding:20px 40px;border-top:1px solid #E8E7F5;">
              <p style="margin:0;font-size:12px;color:#828FA3;line-height:1.5;text-align:center;">
                This is an automated security notification from Kanban Task Manager.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
